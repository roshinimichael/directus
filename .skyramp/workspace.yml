# Skyramp Workspace Configuration
workspace:
  repoName: roshinimichael/directus
  repoUrl: https://github.com/roshinimichael/directus
metadata:
  schemaVersion: v1
  mcpVersion: 0.2.150-rc.sut
  executorVersion: v1.3.25
  createdAt: "2026-06-05T20:51:55.033Z"
  updatedAt: "2026-06-05T20:51:55.039Z"
services:
  - serviceName: directus-api-backend
    language: typescript
    framework: playwright
    testDirectory: tests/blackbox/api
    api:
      schemaPath: packages/specs/src/openapi.yaml
      authType: bearer
      authHeader: Authorization
      baseUrl: http://localhost:8055
    runtimeDetails:
      serverStartCommand: docker compose up -d --build
      runtime: docker
      dockerNetwork: directus_default
  - serviceName: directus-app-frontend
    language: typescript
    framework: playwright
    testDirectory: app/tests
    api:
      authType: none
      authHeader: ""
      baseUrl: http://localhost:8055
    runtimeDetails:
      serverStartCommand: docker compose up -d --build
      runtime: docker
      dockerNetwork: directus_default
